name: Publish to MCP Registry

# Publishes server.json to the official MCP registry when a version tag is pushed.
# Uses GitHub OIDC, so no stored secrets and no browser login are needed.
# The io.github.russfranky namespace is verified automatically for this repo.
#
# Release flow:
#   1. Bump version in package.json and server.json (they must match the tag).
#   2. git tag v0.3.0 && git push origin v0.3.0
# The workflow runs the test suite, validates server.json against the
# registry schema, then publishes. Version 0.2.0 is the current read-only
# release; 0.3.0 is the execute-enabled release.

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies and run tests
        run: |
          npm ci
          npm test

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          chmod +x mcp-publisher

      - name: Set version in server.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "tag version $VERSION does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp && mv server.tmp server.json
          cat server.json

      - name: Validate server.json
        run: |
          npm install -g ajv-cli
          ajv validate -s https://raw.githubusercontent.com/modelcontextprotocol/registry/main/schema/server/v1.json -d server.json --spec=draft2020

      - name: Login and publish
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
